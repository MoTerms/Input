name: Build IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 检查文件结构
        run: |
          ls -la
          test -f project.yml || (echo "缺少 project.yml" && exit 1)
          test -f CppKeyboard/main.m || (echo "缺少 CppKeyboard/main.m" && exit 1)

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, for ESign)
        run: |
          set -o pipefail
          xcodebuild -project CppKeyboard.xcodeproj \
            -scheme CppKeyboard \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products -maxdepth 2 -name "CppKeyboard.app" -type d | head -1)
          echo "APP=$APP"
          test -n "$APP" || (echo "找不到 CppKeyboard.app" && exit 1)
          rm -rf Payload CppKeyboard-unsigned.ipa
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r CppKeyboard-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CppKeyboard-ipa
          path: CppKeyboard-unsigned.ipa
